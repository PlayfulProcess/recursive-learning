<line x1="202.45" y1="1.70" x2="202.45" y2="6.20" stroke="#999" stroke-width=".2"/><line x1="202.45" y1="273.20" x2="202.45" y2="277.70" stroke="#999" stroke-width=".2"/>
<line x1="7.45" y1="271.70" x2="11.95" y2="271.70" stroke="#999" stroke-width=".2"/><line x1="203.95" y1="271.70" x2="208.45" y2="271.70" stroke="#999" stroke-width=".2"/>
