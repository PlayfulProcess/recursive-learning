<svg xmlns="http://www.w3.org/2000/svg" width="215.9mm" height="279.4mm" viewBox="0 0 215.9 279.4">
<rect width="215.9" height="279.4" fill="#fff"/>
<svg x="13.45" y="7.70" width="63" height="88" viewBox="0 0 630 880"><rect width="630" height="880" rx="28" fill="#fbf6ea" stroke="#bfb29a" stroke-width="3"/><rect x="30" y="30" width="570" height="170" rx="14" fill="#3f8f5a"/><text x="315" y="92" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" letter-spacing="4" fill="#fff">LOT 22 · TITLE DEED</text><text x="315" y="160" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="52" font-weight="600" fill="#fff">Wall Street</text><text x="60" y="270" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" letter-spacing="3" fill="#8a3b24">THE LANDLORD’S WAY</text><text x="60" y="320" font-family="Inter, Arial, Helvetica, sans-serif" font-size="30" fill="#2a2420">Price $350</text><text x="60" y="370" font-family="Inter, Arial, Helvetica, sans-serif" font-size="30" fill="#2a2420">Rent $105</text><text x="60" y="420" font-family="Inter, Arial, Helvetica, sans-serif" font-size="30" fill="#2a2420">Three lots on this side: rent $210</text><line x1="60" y1="460" x2="570" y2="460" stroke="#bfb29a" stroke-width="2"/><text x="60" y="510" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" letter-spacing="3" fill="#3f8f5a">PROSPERITY</text><text x="60" y="560" font-family="Inter, Arial, Helvetica, sans-serif" font-size="28" fill="#2a2420">Price $350: every other player</text><text x="60" y="602" font-family="Inter, Arial, Helvetica, sans-serif" font-size="28" fill="#2a2420">gains $10.</text><text x="60" y="652" font-family="Inter, Arial, Helvetica, sans-serif" font-size="28" fill="#2a2420">Ground rent $105 goes to the</text><text x="60" y="694" font-family="Inter, Arial, Helvetica, sans-serif" font-size="28" fill="#2a2420">Public Treasury.</text><text x="315" y="840" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" fill="#5a5048">The Landlord’s Game, live again · after Lizzie Magie</text></svg>
<svg x="76.45" y="7.70" width="63" height="88" viewBox="0 0 630 880"><rect width="630" height="880" rx="28" fill="#fbf6ea" stroke="#bfb29a" stroke-width="3"/><rect x="30" y="30" width="570" height="120" rx="14" fill="#8a3b24"/><text x="315" y="108" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="44" font-weight="600" fill="#fff">The landlord’s way</text><text x="60" y="210" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" fill="#2a2420">• The poorest goes first. Passing Mother</text><text x="60" y="243" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" fill="#2a2420">  Earth: $100 and one lap.</text><text x="60" y="286" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" fill="#2a2420">• Buy free land, railroads, franchises</text><text x="60" y="319" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" fill="#2a2420">  (price into the Treasury); others pay</text><text x="60" y="352" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" fill="#2a2420">  you rent.</text><text x="60" y="395" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" fill="#2a2420">• Necessities: $20 to the Treasury.</text><text x="60" y="428" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" fill="#2a2420">  Luxury: a $50 ticket worth $60, or lose</text><text x="60" y="461" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" fill="#2a2420">  a turn.</text><text x="60" y="504" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" fill="#2a2420">• No Trespassing: Jail. Doubles free you,</text><text x="60" y="537" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" fill="#2a2420">  or pay $50; the third try pays.</text><text x="60" y="580" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" fill="#2a2420">• Short of cash: sell land of your choice</text><text x="60" y="613" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" fill="#2a2420">  to the bank at half price; then the</text><text x="60" y="646" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" fill="#2a2420">  Poorhouse, out.</text><text x="60" y="689" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" fill="#2a2420">• When all still in have five laps, the</text><text x="60" y="722" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" fill="#2a2420">  richest wins: cash, land, $60 a ticket.</text></svg>
<svg x="139.45" y="7.70" width="63" height="88" viewBox="0 0 630 880"><rect width="630" height="880" rx="28" fill="#fbf6ea" stroke="#bfb29a" stroke-width="3"/><rect x="30" y="30" width="570" height="120" rx="14" fill="#3f8f5a"/><text x="315" y="108" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="44" font-weight="600" fill="#fff">Prosperity</text><text x="60" y="210" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" fill="#2a2420">• Buy a lot: price into the Treasury;</text><text x="60" y="243" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" fill="#2a2420">  every other player gains $10.</text><text x="60" y="286" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" fill="#2a2420">• Ground rent goes to the Treasury, not</text><text x="60" y="319" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" fill="#2a2420">  the owner.</text><text x="60" y="362" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" fill="#2a2420">• Railroads and franchises are public: a</text><text x="60" y="395" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" fill="#2a2420">  $10 fare.</text><text x="60" y="438" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" fill="#2a2420">• Luxury: $50 to the Treasury, no ticket,</text><text x="60" y="471" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" fill="#2a2420">  or lose a turn.</text><text x="60" y="514" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" fill="#2a2420">• Passing Mother Earth: the Treasury pays</text><text x="60" y="547" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" fill="#2a2420">  half its money to all, equally.</text><text x="60" y="590" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" fill="#2a2420">• Poorhouse: your land goes back; leave</text><text x="60" y="623" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" fill="#2a2420">  from Mother Earth with $50.</text><text x="60" y="666" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" fill="#2a2420">• All win when the poorest starter has</text><text x="60" y="699" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" fill="#2a2420">  doubled, holds as much as anyone, and</text><text x="60" y="732" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" fill="#2a2420">  nobody has less than their start (equal</text><text x="60" y="765" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" fill="#2a2420">  starts: all double). Five laps each</text><text x="60" y="798" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" fill="#2a2420">  first: lost.</text></svg>
