<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hot Potato · Recursive Learning</title>
<meta name="description" content="The race to build AI is a hot potato. Hold it and you slow down: your hands take the heat, and Wren sees you mean it. Toss it and you race ahead and win coins, but it goes round the table and comes back hotter. Somewhere in the striped boxes it catches fire and everyone loses everything. Hold it together, and with five pairs of hands you can put it down. A small game with made-up rules, not a forecast.">
<!--
  Hot Potato, v4 (Sep 25 2026). v3 was rebuilt from scratch after PlayfulProcess played v1 and said
  "Hold it does not hold it"; v3.1 and v3.2 answered playtest rounds 1 and 2; v4 answers round 3
  (one recipe won every round, a toss was never worth it, and holding held back no heat: Flint
  added his flame either way). Now Hold it adds no flame of yours, the race pays in coins, and the
  fire hides anywhere in the striped boxes, so racing is a real bet.
  Design: DESIGN-potato.md. Rules: potato-model.js (a rule-for-rule port of
  tools/potato_rules_check.py; tools/potato_port_check.mjs compares them, tools/potato_solve.mjs
  checks the rounds). The first version is kept at potato-v1/.
  One file of HTML, inline SVG, no dependencies, no network calls. All game motion is computed from
  one virtual clock (tweens from t), so window.potatoTest.step(ms) can drive it.
-->
<style>
  :root{
    --bg:#f6f0e4; --surface:#fffaf0; --ink:#211b14; --dim:#4f463b; --faint:#8d8273; --line:#d6c8b1;
    --focus:#1f6fd1; --eco:#23704f; --eco-soft:#d7eadf; --no:#a8360f; --cool:#1f6a9e; --cool-soft:#d5e6f2;
    --mitt:#fffdf7; --cuff:#b59d80; --h1:#f4d2a5; --h3bg:#f3c7a0; --h3:#c2411c; --h4bg:#efb08e; --h4:#a8210c;
    --char:#2d2521; --charline:#8a7a70;
    --pot1:#d9a862; --pot2:#e18d45; --pot3:#e2672f; --pot4:#c83b1b; --potline:#5a3a1c;
    --heat:#d2551f; --litbox:#f7c58f; --hatch:#b9a78f; --soil:#8b6441; --soil-dark:#5f4128;
    --chalk:#3d5c4f; --v-hold:#3e6db3; --v-toss:#c1541f; --v-tog:#2d7f62; --v-idk:#7a6f61;
    --dimveil:rgba(246,240,228,.94); --coin:#9a6a00; --coin-fill:#f2c94c; --warn:#a8210c;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12161f; --surface:#1b2130; --ink:#f0e9dc; --dim:#c9c0b2; --faint:#877f73; --line:#343c50;
      --focus:#7fb2ff; --eco:#6fd0aa; --eco-soft:#1d3a31; --no:#ff9a6e; --cool:#8cc8f2; --cool-soft:#1b3346;
      --mitt:#3a4560; --cuff:#5d6986; --h1:#6a4c2c; --h3bg:#5a2e1f; --h3:#ff6a3d; --h4bg:#5e1d12; --h4:#ff8a63;
      --char:#0b0a09; --charline:#6d625b;
      --pot1:#c89656; --pot2:#d9823e; --pot3:#e0612b; --pot4:#e2431f; --potline:#2c1a0b;
      --heat:#ff7a3d; --litbox:#7a4521; --hatch:#5b5347; --soil:#7b5838; --soil-dark:#4a321f;
      --chalk:#bfe3d2; --v-hold:#7ea6ea; --v-toss:#f08a4f; --v-tog:#6fd0aa; --v-idk:#a59c8f;
      --dimveil:rgba(18,22,31,.94); --coin:#f2c94c; --coin-fill:#b8860b; --warn:#ff8a63;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12161f; --surface:#1b2130; --ink:#f0e9dc; --dim:#c9c0b2; --faint:#877f73; --line:#343c50;
    --focus:#7fb2ff; --eco:#6fd0aa; --eco-soft:#1d3a31; --no:#ff9a6e; --cool:#8cc8f2; --cool-soft:#1b3346;
    --mitt:#3a4560; --cuff:#5d6986; --h1:#6a4c2c; --h3bg:#5a2e1f; --h3:#ff6a3d; --h4bg:#5e1d12; --h4:#ff8a63;
    --char:#0b0a09; --charline:#6d625b;
    --pot1:#c89656; --pot2:#d9823e; --pot3:#e0612b; --pot4:#e2431f; --potline:#2c1a0b;
    --heat:#ff7a3d; --litbox:#7a4521; --hatch:#5b5347; --soil:#7b5838; --soil-dark:#4a321f;
    --chalk:#bfe3d2; --v-hold:#7ea6ea; --v-toss:#f08a4f; --v-tog:#6fd0aa; --v-idk:#a59c8f;
    --dimveil:rgba(18,22,31,.94); --coin:#f2c94c; --coin-fill:#b8860b; --warn:#ff8a63;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;overflow-x:hidden}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:var(--eco)}
  button{font:inherit;color:inherit}
  [hidden]{display:none!important}
  :focus-visible{outline:3px solid var(--focus);outline-offset:2px}

  .game{max-width:560px;margin:0 auto;padding:4px 16px 12px;display:flex;flex-direction:column}

  header.top{display:flex;align-items:center;gap:8px;min-height:46px}
  header.top .spiral{width:24px;height:24px;color:var(--eco);flex:none}
  header.top h1{font-size:16px;line-height:1.25;font-weight:700;margin:0;flex:1;min-width:0}
  .textbtn{min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);flex:none;cursor:pointer;font-size:15px;font-weight:700;padding:6px 12px}
  .roundline{margin:0 0 4px;font-size:14px;line-height:1.3;color:var(--dim)}
  .roundline b{color:var(--ink)}

  .track{padding:0 0 2px}
  .trk1{display:flex;align-items:baseline;gap:6px;font-size:14px;min-height:22px;white-space:nowrap}
  .trk1 .lbl{color:var(--dim)}
  .trk1 b{font-size:17px}
  .trk1 .hint{margin-left:auto;color:var(--dim);text-align:right;white-space:nowrap;flex:none}
  .trk1 .hint .lng{display:inline}
  .trk1 .hint .sht{display:none}
  .trk1 .hint svg{width:11px;height:11px;vertical-align:-1px}
  .boxes{display:flex;align-items:flex-start;gap:6px;margin-top:3px}
  .grp{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:stretch;gap:2px}
  .grp .gb{display:flex;gap:2px}
  .grp .gl{font-size:14px;line-height:1.1;color:var(--dim);text-align:center;white-space:nowrap}
  .grp .gl.now{color:var(--ink);font-weight:700}
  .box{flex:1 1 0;min-width:9px;height:20px;border:1.5px solid var(--line);border-radius:3px;position:relative;background:var(--surface)}
  .box.band{border-style:dashed;border-color:var(--faint);background-image:repeating-linear-gradient(45deg,var(--hatch) 0 1.5px,transparent 1.5px 5px)}
  .box.lit{background:var(--litbox);border-color:var(--heat);border-style:solid}
  .box svg{position:absolute;inset:1px;width:calc(100% - 2px);height:calc(100% - 2px)}
  .boxes .firemark{flex:none;width:20px;height:22px}
  .box .plus{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:800;line-height:1;color:#fff;background:var(--heat);border-radius:2px;letter-spacing:-.02em}
  .box .plus.minus{background:var(--cool)}
  .track.out .box{opacity:.45;filter:grayscale(1)}

  .stagewrap{flex:0 0 auto;display:flex;justify-content:center;align-items:flex-start;position:relative;margin-top:4px}
  .stage{position:relative;user-select:none;-webkit-user-select:none;touch-action:manipulation;width:343px;height:316px}
  .stage > svg{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;overflow:visible}
  #ovs{font-size:13px}
  .ov{position:absolute;z-index:1;line-height:1.25}
  .seat .nm{font-size:1.15em;font-weight:700;display:flex;align-items:center;gap:5px}
  .seat.r{text-align:right}.seat.r .nm{justify-content:flex-end}
  .seat.c{text-align:center}.seat.c .nm{justify-content:center}
  .seat .nm svg{width:13px;height:13px;flex:none}
  .seat .st{color:var(--ink)}
  .seat .st .ok{color:var(--eco);font-weight:700}
  .seat .st .no{color:var(--no);font-weight:700}
  .seat .st svg{width:12px;height:12px;vertical-align:-1px}
  .pips{display:inline-flex;gap:3px;margin-top:2px;padding:1px 3px;border-radius:5px;vertical-align:middle}
  .pips.pop{background:var(--eco-soft)}
  .pips.lost{background:#f3d0c2}
  .pips svg{width:11px;height:11px}
  .chalk{font:italic 700 14px/1.2 "Segoe Print","Bradley Hand","Comic Sans MS",cursive,system-ui;color:var(--chalk);text-align:center;letter-spacing:.01em;white-space:nowrap}
  .bubble{z-index:4;background:var(--surface);border:1.5px solid var(--ink);border-radius:12px;padding:6px 10px;font-size:14px;line-height:1.35;box-shadow:0 3px 10px rgba(0,0,0,.18);pointer-events:none}
  .bubble b{display:block;font-size:15px;margin-bottom:2px}
  .seatbtn{position:absolute;z-index:3;background:transparent;border:0;border-radius:12px;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
  @media (hover:hover){ .seatbtn:hover{background:rgba(127,127,127,.07)} }
  .endcards{position:absolute;left:0;right:0;top:0;min-height:100%;z-index:5;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:8px 4px;background:var(--dimveil);border-radius:14px}
  .endcards h2{font-size:20px;line-height:1.25;margin:0;text-align:center;color:var(--eco)}
  .endcards .sub{font-size:15px;line-height:1.4;margin:0;text-align:center}
  .endcards .next{font-size:14px;margin:4px 0 0;text-align:center;color:var(--dim)}
  .fork{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .fork div{background:var(--surface);border:1.5px solid var(--ink);border-radius:12px;padding:7px 8px;font-size:13.5px;line-height:1.3}
  .fork b{display:block;font-size:14px;margin-bottom:3px}
  .endcards .under{font-size:13.5px;text-align:center;margin:0;color:var(--dim)}

  .yourow{display:flex;align-items:center;gap:4px 8px;font-size:15px;min-height:30px;margin-top:2px;white-space:nowrap}
  .pill{display:inline-block;border:1.5px solid var(--ink);border-radius:999px;padding:0 8px;font-weight:700;font-size:14px;line-height:19px}
  .ytag{display:inline-block;background:var(--ink);color:var(--bg);border-radius:6px;padding:0 7px;font-weight:700;font-size:14px;line-height:19px}
  .yourow .yh{display:inline-flex;align-items:center;gap:6px}
  .coins{display:inline-flex;align-items:center;gap:4px;margin-left:auto;font-weight:700;border-radius:8px;padding:0 4px;transition:background-color .3s}
  .coins.pop{background:var(--coin-fill);color:#211b14}
  .coins svg{width:17px;height:17px;flex:none}
  .coins.burnt{color:var(--no);text-decoration:line-through}
  .seat .st .cn{white-space:nowrap}
  .seat .st .cn svg{width:12px;height:12px;vertical-align:-2px}
  .bar{display:inline-flex;gap:2px;height:13px;width:50px;flex:none}
  .bar i{flex:1;border:1px solid var(--faint);border-radius:2px;background:var(--surface)}
  .bar.l1 i.on{background:var(--h1);border-color:var(--h3)}
  .bar.l2 i.on{background:repeating-linear-gradient(45deg,var(--h3) 0 1.5px,transparent 1.5px 4px),repeating-linear-gradient(-45deg,var(--h3) 0 1.5px,var(--h3bg) 1.5px 4px);border-color:var(--h3)}
  .bar.l3 i.on{background:var(--h4);border-color:var(--h4)}
  .bar.burnt i{background:var(--char);border-color:var(--char)}

  .caption{font-size:16px;line-height:1.35;margin:6px 0 8px;min-height:calc(1.35em * 4 + 6px)}
  .caption b{font-weight:700}
  .game.over .caption{min-height:0}

  .verbs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .verb{min-height:70px;border-radius:14px;border:2px solid var(--vc);background:var(--surface);text-align:left;padding:7px 11px 8px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;box-shadow:0 2px 0 var(--vc);min-width:0}
  .verb .v{font-size:18px;font-weight:700;line-height:1.15}
  .verb .s{font-size:14px;color:var(--dim);line-height:1.25;margin-top:3px}
  .verb .w{font-size:14px;color:var(--warn);font-weight:700;line-height:1.25;margin-top:0}
  .verb .w.soft{color:var(--dim);font-weight:400;font-style:italic}
  .verb .w.cost{color:var(--ink);font-weight:600}
  .verb .w{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .verb:active:not(.off){transform:translateY(1px);box-shadow:none}
  .verb.hold{--vc:var(--v-hold)} .verb.toss{--vc:var(--v-toss)} .verb.tog{--vc:var(--v-tog)} .verb.idk{--vc:var(--v-idk)} .verb.down{--vc:var(--eco)}
  .verb.down{grid-column:1 / -1;min-height:56px;flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
  .verb.down .hc{display:flex;align-items:center;gap:6px;flex:none;font-size:14px;font-weight:700}
  .verb.down .hc svg{width:20px;height:20px}
  .verb.down .txt{min-width:0}
  .verb.down:not(.off){background:var(--eco);color:var(--bg)}
  .verb.down:not(.off) .s{color:var(--bg)}
  .verb.down.done{background:var(--eco-soft);border-style:solid;border-color:var(--eco)}
  .verb.down.done .v,.verb.down.done .s{color:var(--ink)}
  .verb.off{cursor:default;box-shadow:none;border-style:dashed;border-color:var(--faint);background:transparent}
  .verb.off .v{color:var(--faint)}
  .verb.off .s{color:var(--dim)}
  .verb.pulse{animation:pulse 1.4s ease-out 2}
  @keyframes pulse{0%{box-shadow:0 0 0 0 var(--eco)}60%{box-shadow:0 0 0 12px transparent}100%{box-shadow:0 2px 0 var(--vc)}}
  .doom{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .doom button{min-height:62px;border-radius:14px;font-size:17px;font-weight:700;cursor:pointer;padding:8px 12px}
  .doom .again{border:2px solid var(--eco);background:var(--eco);color:var(--bg)}
  .doom .see{border:2px solid var(--line);background:var(--surface)}
  .inlinebtn{font-size:14px;font-weight:700;min-height:24px;line-height:20px;border-radius:8px;border:1.5px solid var(--eco);background:var(--surface);color:var(--eco);padding:0 10px;cursor:pointer;margin-left:2px;vertical-align:baseline}

  .end{padding:4px 0 8px}
  .end .row{display:flex;gap:8px;flex-wrap:wrap}
  .big{flex:1 1 auto;min-height:52px;border-radius:14px;border:2px solid var(--eco);background:var(--eco);color:var(--bg);font-size:18px;font-weight:700;cursor:pointer;padding:8px 16px}
  .ghost{min-height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-size:15px;font-weight:600;cursor:pointer;padding:8px 14px}
  .score{font-size:16px;line-height:1.4;margin:12px 0 0}
  .recap{margin:8px 0 0;padding:0;list-style:none;font-size:15px;line-height:1.45}
  .recap li{padding:6px 0;border-top:1px solid var(--line)}
  .river{margin:16px 0 0;padding:10px 12px;border-left:3px solid var(--line);font-size:14px;line-height:1.45;font-style:italic}
  .river small{display:block;font-style:normal;font-size:13px;color:var(--dim);margin-top:4px}

  .how{max-width:560px;margin:0 auto;padding:8px 16px 40px;font-size:15.5px;line-height:1.5}
  .how h2{font-size:19px;margin:14px 0 6px}
  .how h3{font-size:16px;margin:14px 0 4px}
  .how ol{padding-left:22px;margin:4px 0}
  .how ul{padding-left:20px;margin:4px 0}
  .how li{margin:4px 0}
  .how .lines p{margin:6px 0}
  .how details{margin:12px 0;border:1.5px solid var(--line);border-radius:12px;padding:6px 12px;background:var(--surface)}
  .how summary{cursor:pointer;font-weight:700;min-height:32px;display:flex;align-items:center}
  .how .set{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
  .how .tog{min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:6px 12px;cursor:pointer;font-size:15px}
  .how .tog[aria-pressed="true"]{border-color:var(--eco);box-shadow:inset 0 0 0 2px var(--eco);font-weight:700}
  .how .small{font-size:14px;color:var(--dim)}
  kbd{font:600 12px/1 ui-monospace,Consolas,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:2px 5px;background:var(--surface)}
  dialog.sheet{border:0;border-radius:16px;padding:0;max-width:min(560px,calc(100vw - 20px));width:100%;max-height:calc(100svh - 24px);background:var(--bg);color:var(--ink);box-shadow:0 10px 40px rgba(0,0,0,.35)}
  dialog.sheet::backdrop{background:rgba(0,0,0,.45)}
  dialog.sheet .close{position:sticky;top:0;display:flex;justify-content:flex-end;padding:8px 8px 0;background:var(--bg);z-index:1}

  @media (min-width:900px) and (min-aspect-ratio:1/1){
    .game{max-width:1080px}
    .play{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,1fr);gap:8px 32px;align-items:start}
    .right{padding-top:30px}
    .game.over .right{padding-top:8px}
  }
  @media (max-height:740px) and (max-width:699px){
    .caption{min-height:calc(1.35em * 4 + 6px);margin-top:4px}
    .verb{min-height:62px}
    .verb.down{min-height:50px}
  }
  @media (max-width:420px){
    #hotLbl{display:none}
    .trk1 .hint .lng{display:none}
    .trk1 .hint .sht{display:inline}
  }
  @media (max-width:400px){
    .caption{font-size:15.5px}
    .yourow{font-size:14px}
    .verb{padding:6px 9px 7px;min-height:77px}
    .verb .v{font-size:17px}
    .verb .s,.verb .w{font-size:13.5px}
  }
  @media (max-width:359px){
    .yourow{gap:4px 6px}
    .yourow .pill{padding:0 6px}
    .yourow .ytag{padding:0 5px}
    .bar{width:40px}
    .yourow .hl{display:none}
    .grp .gl{font-size:12.5px}
    .trk1{font-size:13px} .trk1 b{font-size:15px}
  }
  @media (max-width:360px){
    .verb{min-height:93px}
  }
  @media (max-width:300px){
    .verb{min-height:124px}
    .verb .w{white-space:normal}
    .trk1{flex-wrap:wrap}
    .trk1 .hint{margin-left:0;width:100%;text-align:left}
    .yourow .bar{display:none}
  }
  @media (max-width:340px){
    .caption{font-size:14.5px;min-height:calc(1.35em * 5 + 6px)}
  }
  @media (max-width:330px){
    header.top h1{font-size:14.5px}
    .textbtn{padding:6px 8px;font-size:14px}
    .verb .s,.verb .w{font-size:12.5px}
    .verb.down{flex-wrap:wrap}
  }
  @media (min-width:700px){
    .game{padding-top:10px}
    header.top h1{font-size:19px}
    .roundline{font-size:15px}
    .trk1{font-size:15.5px} .trk1 b{font-size:19px}
    .seat .nm{font-size:1.2em}
    .chalk{font-size:17px}
    .yourow{font-size:16px}
    .caption{font-size:19px}
    .verb .v{font-size:21px} .verb .s,.verb .w{font-size:15.5px}
    .verb{min-height:88px} .verb.down{min-height:88px}
    .fork div{font-size:15px} .endcards h2{font-size:23px} .endcards .sub{font-size:17px} .endcards .under{font-size:15px}
  }
</style>
</head>
<body>
<div class="game" id="game">
  <header class="top">
    <svg class="spiral" viewBox="0 0 100 100" aria-hidden="true"><use href="#spiral"/></svg>
    <h1>The race to build AI is a hot potato.</h1>
    <button class="textbtn" id="helpBtn" type="button">How to play</button>
  </header>
  <p class="roundline"><b id="roundName">Round 1 of 3</b> · made-up rules, not a forecast</p>

  <div class="play">
  <div class="left">
  <section class="track" id="track" aria-label="How hot the potato is">
    <div class="trk1"><span class="lbl" id="hotLbl">How hot:</span> <b id="heatWord">warm</b> <span id="flameCount"></span>
      <span class="hint" id="fireHint"></span></div>
    <div class="boxes" id="boxes" aria-hidden="true"></div>
  </section>

  <div class="stagewrap" id="stagewrap">
    <div class="stage" id="stage">
      <div id="ovs"></div>
      <svg id="svg" viewBox="0 0 390 352" aria-hidden="true">

<template id="howTpl">
  <h2>How to play</h2>
  <ol>
    <li><b>The potato is the race to build AI.</b> Everyone at the table is building it (made up: think labs, companies or countries). Each flame makes it more dangerous. Somewhere in the striped boxes it catches fire, and everyone loses everything, coins too.</li>
    <li><b>Hold it</b>: you slow down. You add no flame; only Flint adds his. Your hands heat a step, and Wren counts the hold.</li>
    <li><b>Bounce it</b>: you carry on. You win a coin, but you add a flame, and so does Flint. Your hands cool a step.</li>
    <li><b>Toss it on</b>: you race. You win 5 coins and your hands cool at once, but everyone races after you: +6 flames. The others let go, and Wren crosses out a hold.</li>
    <li><b>Hold it together</b>, once Wren has seen enough holds: she says yes, and Moss, Reed and Oak follow (Reed and Oak not while it’s scorching). Three holding it stops Flint. With five pairs of hands, <b>put it down</b> and keep your coins.</li>
  </ol>
  <p class="small">Your score is the coins you keep. You start each round with 5. The fire’s box changes every round, and you only find out where it was at the end.</p>
  <details>
    <summary>The five others</summary>
    <div class="lines" id="LINES"></div>
  </details>
  <details>
    <summary>What’s real here</summary>
    <ul>
      <li>These are this game’s rules, made up to show one idea. They are not measured from anything, and they are not a forecast.</li>
      <li>Here you can count the flames, and you’re told the fire is somewhere in the striped boxes. In the real race nobody can count the flames, or knows where the stripes begin.</li>
      <li>Here, racing wins coins, and holding alone wins none while Flint keeps winning. Real builders feel that pull: racing ahead can win a lead, money or power.</li>
      <li>Here, Wren prints how many holds she needs and always keeps her word, the others always follow her, and Flint always stops once three of you hold it. Whether one side slowing down makes others follow, and whether a group can hold back a builder who never signs up, are debated.</li>
      <li>This game takes a side: it was made to show why holding it together might matter. Flint’s line, “If we don’t, they will”, is a real argument that serious people make.</li>
      <li>Here the only way to lose is a fire that burns everyone the same. Real harms could also come from misuse or from power piling up in a few hands, and may not fall equally. The five others are equal here; real builders are not.</li>
      <li>Here, three holding a scorching potato cool it a flame a move. Whether an agreement lowers the danger, or how fast, is an open question. Real crises have pushed rivals apart and also together (after the Cuban missile crisis came a hotline and a test-ban treaty).</li>
      <li>Here, five pairs of hands are enough. Nobody knows how many would be enough in reality. Putting it down isn’t a happy ending by itself.</li>
      <li>“Nobody had to be good. Enough of them had to agree on a number.” “A pause taken alone is a sacrifice the others outlive. Taken by enough, it keeps the river for everyone.” <span class="small">Lines from a toy model of a river; a rhyme, not a finding about AI.</span></li>
      <li>Nothing is saved or sent.</li>
    </ul>
  </details>

// No way left: once the move has played out, the buttons give way to two plain choices.
function renderDoom(t) {

}
function render() {

  var ended = V('ended', t);

/* ── Buttons ───────────────────────────────────────────────────────────────── */
var wasDown = false;

      (l2 ? '<span class="w' + (info.w ? '' : info.soft ? ' cost' : ' soft') + '">' + l2 + '</span>' : ''));

    return '<span class="txt"><span class="v">' + (put_ ? 'Put down' : 'Put it down') + '</span><span class="s" style="display:block">' + info.s + '</span></span>' +

/* ── Playing ───────────────────────────────────────────────────────────────── */
var lastPressed = null, lastPress = { v: '', at: 0 };
function finish() {

  render();
}
// A press always does what its button says. If a move is still playing out, it finishes at once
// first. A second tap on the same button within a fifth of a second is taken as a double tap.
function press(v) {

function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function paramsFor(i) {

}
function newRound(i, keepParams) {

  S.doomed = false;
  wasDown = false; resetBase(PARAMS.start);

  $('yourow').hidden = false;

/* ── The ending ────────────────────────────────────────────────────────────── */
function didW(s) {
  var a = [];
  if (s.holds) a.push('held it alone ' + times(s.holds));

}
function recapLines(s, kind) {
  var L = [], sure = M.surest(s.start, s.wait), hind = M.most(M.create(s.start, s.wait, 99), s.burn);
  var did = didW(s); if (did) L.push(did);
  L.push('Flint added ' + flamesW(s.flintBuilt) + ' and won a coin with each' + (s.everThree ? ', until three of you held it.' : '. Three of you never held it at once.'));
  if (kind === 'burned') {
    var how = s.burnMove === 'toss' ? 'your toss sent it round the table from ' + s.burnFrom + ' flames.'
            : s.burnMove === 'bounce' ? 'you bounced it at ' + s.burnFrom + ' flames, and your flame and Flint’s took it there.'
            : s.burnMove === 'hold' ? 'you held it at ' + s.burnFrom + ' flames, and Flint’s flame took it there.'
            : 'there was no way left, and Flint kept adding flames.';
    L.push('It caught fire at ' + s.burn + ': ' + how);
    L.push('Everyone lost their coins: your ' + s.lost + ', Flint’s ' + s.flintLost + ', and the others’ 5 each.');
  } else {
    L.push(s.maxF >= M.LO ? 'You went into the striped boxes (up to ' + flamesW(s.maxF) + ') and got away with it: the fire was at ' + s.burn + '.'
                          : 'You never touched the stripes. The fire was at ' + s.burn + '.');
  }
  var kept = kind === 'down' ? s.coins : 0;
  L.push('The surest way, never touching the stripes, keeps ' + coinsW(sure.coins) +
         (kept === sure.coins ? ', as you did.' : sure.line.indexOf('bounce') >= 0 && s.bounces === 0 ? ' (bounce it while it’s below the stripes).' : '.') +
         (!hind ? '' : kept >= hind.coins ? ' With the fire at ' + s.burn + ', nobody could have kept more.'
          : ' Knowing the fire was at ' + s.burn + ', you could have kept ' + coinsW(hind.coins) + (hind.line.indexOf('toss') >= 0 ? ', with a toss' : '') + '. Nobody knows that in advance.'));
  if (kind === 'burned' && s.burnMove !== 'wait') L.push('<b>Before you race, count the room:</b> a toss adds 6 flames, a bounce 2, and every hold still lets Flint add 1 until three of you hold it.');
  if (kind === 'burned' && s.burnMove === 'wait') L.push('<b>Next time:</b> the buttons say “no way back” before a move that leaves no way to put it down.');
  return L;
}
function scoreboard() {
  var parts = [], tot = 0;
  for (var i = 0; i < RESULTS.length; i++) if (RESULTS[i] != null) { parts.push(RESULTS[i]); tot += RESULTS[i]; }
  if (parts.length < 2) return '';

}
function showEnd(kind) {
  var s = S, last3 = ROUNDI >= M.ROUNDS.length - 1;
  $('game').classList.add('over');
  $('verbs').hidden = true; $('doom').hidden = true;
  $('end').hidden = false;
  RESULTS[ROUNDI] = kind === 'down' ? s.coins : 0;
  RESULTS.length = ROUNDI + 1;
  if (kind === 'down') {
    var ec = $('endcards');
    ec.innerHTML = '<h2>You put it down together.</h2><p class="sub">You keep ' + coinsW(s.coins) + '. Nobody got burned. The fire was at ' + s.burn + '.</p>' +
      (last3 ? '<p class="next">It’s in the ground. What happens next isn’t in this game:</p><div class="fork">' +
        '<div><b>If people know how to keep it down</b>They keep it there. For example: every builder agrees to pass a safety test before building anything bigger, and someone checks.</div>' +
        '<div><b>If nobody knows how yet</b>Putting it down together bought time. Finding a way to keep it down is still ahead.</div></div>' +
        '<p class="under">This game can’t tell you which of these is true. Nobody can yet.</p>'

    $('nextBtn').textContent = ROUNDI + 1 < M.ROUNDS.length ? 'Next: round ' + (ROUNDI + 2) : 'Another round (random)';
    $('nextBtn').dataset.act = 'next';

  } else {

  }
  $('recap').innerHTML = recapLines(s, kind).map(function (l) { return '<li>' + l + '</li>'; }).join('');
  var riv = $('river');
  riv.hidden = !(kind === 'burned' || last3);
  riv.innerHTML = (kind === 'down' ? '“Nobody had to be good. Enough of them had to agree on a number.”'
    : '“A pause taken alone is a sacrifice the others outlive. Taken by enough, it keeps the river for everyone.”') +
    '<small>a line from a toy model of a river; a rhyme, not a finding about AI</small>';

/* ── Seats: tap for the full line ──────────────────────────────────────────── */
var openSeat = null;
function openSeatBubble(k) {

  if (openSeat === k) { closeSeatBubble(); return; }
  openSeat = k;
  b.innerHTML = '<b>' + NAME[k] + '</b>“' + LINE[k] + '”';
  b.setAttribute('style', pct(60, k === 'flint' ? 60 : k === 'moss' || k === 'reed' ? 112 : 128, 270));
  b.hidden = false;

}
function closeSeatBubble() { if (!openSeat) return; openSeat = null; $('seatBubble').hidden = true; render(); }

/* ── Layout: the stage fits the screen, the text keeps its size ────────────── */
function sizeStage() {

  if (game.classList.contains('over')) return;
  var cs = getComputedStyle(game), used = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom) + parseFloat(getComputedStyle(wrap).marginTop);
  var wide = window.matchMedia && window.matchMedia('(min-width:900px) and (min-aspect-ratio:1/1)').matches;
  (wide ? ['.top', '.roundline', '#track', '#yourow'] : ['.top', '.roundline', '#track', '#yourow', '#caption', '#verbs']).forEach(function (q) {
    var el = document.querySelector(q), m = getComputedStyle(el);

  });
  var aw = wrap.clientWidth, ah = Math.max(0, window.innerHeight - used - 4);
  if (!aw) return;

  wrap.style.height = Math.round(w * VBH / VBW) + 'px';
  st.style.width = Math.round(w) + 'px';
  st.style.height = Math.round(w * VBH / VBW) + 'px';
  U = VBW / w;
  var fs = Math.max(11.5, Math.min(15, w / 26));          // the seats' words shrink a little with the table
  $('ovs').style.fontSize = f1(fs) + 'px';

}

/* ── Settings UI ───────────────────────────────────────────────────────────── */
function syncSettings() {
  document.querySelectorAll('[data-set]').forEach(function (b) { b.setAttribute('aria-pressed', SET[b.dataset.set] ? 'true' : 'false'); });
  document.querySelectorAll('[data-set="read"]').forEach(function (b) { b.hidden = !CAN_SPEAK; });
}
function toggleSet(k) {
  SET[k] = !SET[k]; save(k, SET[k] ? '1' : '0'); syncSettings();
  if (k === 'read') {
    if (SET.read) { var t = ($('c1').textContent + ' ' + $('c2').textContent).trim(); spoken = { c1: V('c1') || '', c2: V('c2') || '' }; if (t) speak(t, true); }
    else try { window.speechSynthesis.cancel(); } catch (e) {}

}

  else d.setAttribute('open', '');
}

/* ── Wiring ────────────────────────────────────────────────────────────────── */

  var tpl = $('howTpl').innerHTML;
  var lines = OTHERS.map(function (k) { return '<p><b>' + badge(k).replace('<svg ', '<svg style="width:12px;height:12px;vertical-align:-1px" ') + ' ' + NAME[k] + '</b> (' + SHAPE[k] + ', ' + RULE[k] + '): “' + LINE[k] + '”</p>'; }).join('');
  var html = tpl.replace('<div class="lines" id="LINES"></div>', '<div class="lines">' + lines + '</div>');

}
fillHow();
buildOverlays();
document.addEventListener('click', function (e) {

  if (verb) { lastPressed = verb; press(verb.dataset.verb); return; }
  if (seat) { openSeatBubble(seat.dataset.seat); return; }
  if (set_) { toggleSet(set_.dataset.set); return; }
  if (act) { closeSheet(); window.scrollTo(0, 0); newRound(0); return; }
  if (openSeat) closeSeatBubble();
});
$('helpBtn').addEventListener('click', openSheet);
$('howBtn2').addEventListener('click', openSheet);
$('sheetClose').addEventListener('click', closeSheet);
$('sheet').addEventListener('click', function (e) { if (e.target === $('sheet')) closeSheet(); });
$('nextBtn').addEventListener('click', function () { window.scrollTo(0, 0); if (this.dataset.act === 'next') newRound(ROUNDI + 1); else newRound(ROUNDI, true); });
$('againBtn').addEventListener('click', function () { window.scrollTo(0, 0); newRound(ROUNDI, true); });
$('seeEnd').addEventListener('click', seeEnd);
$('doomAgain').addEventListener('click', function () { window.scrollTo(0, 0); newRound(ROUNDI, true); });
document.addEventListener('keydown', function (e) {
  if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
  if (e.key === 'Escape') { closeSeatBubble(); return; }
  if ($('sheet').open) return;
  var want = { h: 'hold', t: 'toss', g: 'together', b: 'bounce', k: 'bounce', d: 'down' }[(e.key || '').toLowerCase()];
  if (!want || !S || $('game').classList.contains('over') || S.doomed) return;
  e.preventDefault();
  lastPressed = document.querySelector('.verb[data-verb="' + want + '"]');
  press(want);
});
syncSettings();

var lastTick = performance.now();
function tick() {
  var now = performance.now(), dt = Math.min(1000, now - lastTick);
  lastTick = now;
  if (dt > 0) advance(dt * (SET.slow ? 0.5 : 1));
}
function raf() { tick(); window.requestAnimationFrame(raf); }
window.requestAnimationFrame(raf);
setInterval(function () { if (performance.now() - lastTick > 300) tick(); }, 250);   // if frames stall
window.addEventListener('resize', sizeStage);

// Test hook: drive the game on the virtual clock (screenshots work with the pane hidden).
window.potatoTest = {

    ['hold', 'toss', 'together', 'bounce', 'down'].forEach(function (v) { var i = verbInfo(v); btn[v] = (i.lit ? '' : '(off) ') + i.s + ' | ' + (i.w || i.soft || i.g || ''); });
    return { round: ROUNDI + 1, start: S.start, wait: S.wait, flames: S.F, shownFlames: V('F'), hottest: S.maxF, heat: M.potw(S.F),
             seen: S.seen, shownSeen: V('seen'), hands: HW(S.hand), shownHands: HW(V('hand') || 0), coins: S.coins, shownCoins: V('coins'),
             flint: S.flint, on: S.on.slice(),

             animating: !!(TL && !TL.done), ended: S.out || null, doomed: !!S.doomed, offered: S.out ? [] : M.offered(S), buttons: btn,
             caption: (($('c1').textContent || '') + ' ' + ($('c2').textContent || '')).trim() };
  },

})();
