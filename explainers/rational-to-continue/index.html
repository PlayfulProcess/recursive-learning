<!--
  Home (Sep 28 2026): learning.recursive.eco/explainers/rational-to-continue/ (a draft).
  The model behind every tagged number: model/race_model.py, with its output in
  model/race_model_output.txt (run: python race_model.py).
  In a recursive.eco playlist (an embed item):
    ?embed=1       the clean 16:9 frame (the same as #record); a framed page gets it too
    ?scene=N       play scene N only (0-9); add &to=M to play on through scene M
    ?clock=1       follow the player's clock: the viewer posts { type: 'driven' }, then
                   { type: 'clock', t, playing } on every tick of the item's dwell, and the
                   page seeks to t seconds into its scene range (view.html mountEmbedClock;
                   the ads in recursive.eco/ads/ read the same messages). Only the parent
                   frame is listened to.
  Set the item's card_hold_sec to the range's length (the storyboard table lists each scene's).
-->
<title>Rational to Continue</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap');
:root{
  color-scheme:dark;
  --ground:#111014;--surface:#1b1920;--line:#2e2a36;--ink:#ede9f2;--muted:#9a93a8;
  --accent:#b57bff;--risk:#e8663d;--calm:#e9c46a;--scrim:rgba(17,16,20,.94);

  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono","SFMono-Regular",Menlo,Consolas,monospace;

*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink)}
body{font-family:var(--serif);-webkit-font-smoothing:antialiased}
.page{max-width:1280px;margin:0 auto;padding:16px 16px 56px}
.wrap{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:var(--ground);border:1px solid var(--line)}
.stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden}
.board{position:absolute;left:0;top:0}

.hd{position:absolute;left:64px;top:40px}
.kk{font:500 15px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.tt{font:600 40px/1.1 var(--sans);margin-top:6px;color:var(--ink)}
.tc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 120px;transition:opacity .6s}
.tc .kk{font-size:21px}
.tc .tt{font-size:78px;margin-top:18px;text-wrap:balance}
.brand{position:absolute;right:64px;top:44px;display:flex;align-items:center;gap:12px;font:400 16px var(--sans);color:var(--muted)}
.gone{display:none!important}
.logo{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round}
.cap{position:absolute;left:110px;right:110px;bottom:22px;height:124px;display:flex;align-items:center;justify-content:center;text-align:center;font:400 32px/1.3 var(--serif);color:var(--ink);text-wrap:balance;transition:opacity .6s}
.cap.in{animation:capIn .45s ease-out}
.cap.big{font-size:42px;font-style:italic}
.cap.hope{color:var(--calm)}
@keyframes capIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.stage.titling #bd,.stage.titling #fxl,.stage.titling #col,.stage.titling .cap{opacity:0}
/* one focus at a time: whatever is not in focus dims */
:where(#bd *,#setup *,#cast *){transition:opacity .6s,filter .6s}
#bd,#fxl,#setup,#cast,#col{transition:opacity .6s,filter .6s}
.dim{filter:opacity(.28) saturate(.35)}
.fxr{fill:none;stroke:var(--accent);stroke-width:1.5;transition:opacity .45s}
.fxo{outline:1.5px solid var(--accent);outline-offset:8px;border-radius:2px}
/* right column: set-up numbers, source quotes */
.col{position:absolute;left:1080px;top:132px;width:462px;height:600px}
.panel{position:absolute;inset:0}
.ph{font:500 13px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.sl{font:400 20px/1.35 var(--sans);padding:10px 0;border-top:1px solid var(--line);color:var(--ink)}
.tag{font:400 12.5px var(--mono);color:var(--muted);margin-left:10px;white-space:nowrap}
.sn{font:italic 400 17px/1.4 var(--serif);color:var(--muted);margin:14px 0 0}
.pt{border-collapse:collapse;width:100%;margin:2px 0 6px}
.pt th{font:400 15px var(--sans);color:var(--muted);text-align:left;padding:8px 6px}
.pt td{font:500 26px var(--mono);font-variant-numeric:tabular-nums;padding:8px 6px;border-top:1px solid var(--line)}
.pt td.calm{color:var(--calm)} .pt td.risk{color:var(--risk)}
/* cards: people and sources */
.card{border-top:2px solid var(--accent);padding:12px 0 14px;margin-bottom:12px}
.who{font:600 23px/1.2 var(--sans);color:var(--ink)}
.role{font:400 15px/1.35 var(--sans);color:var(--muted);margin-top:3px}
.q{font:italic 400 21px/1.38 var(--serif);margin:10px 0 8px;color:var(--ink)}
.src{font:400 13px/1.45 var(--mono);color:var(--muted)}
.src a{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.logic{font:400 15.5px/1.42 var(--sans);margin:10px 0 0;color:var(--ink)}
.logic b{font-weight:600;color:var(--calm)}
.cav{font:400 13.5px/1.42 var(--serif);color:var(--muted);margin:8px 0 0}
.ex{font:500 11px var(--mono);letter-spacing:.12em;color:var(--risk);border:1px solid var(--risk);padding:1px 6px;margin-left:8px;vertical-align:middle}
/* cast: one card at a time, large, over the dimmed board */
.castp{position:absolute;left:290px;top:124px;width:1020px;height:622px;padding:32px 56px;background:var(--scrim);border:1px solid var(--line);overflow:hidden}
.castp .ph{font-size:15px;margin-bottom:16px}
.bigc{border-top:2px solid var(--accent);padding-top:18px}
.bigc .who{font-size:32px}
.bigc .role{font-size:19px;line-height:1.4;margin-top:4px}
.bigc .q{font-size:32px;line-height:1.36;margin:16px 0 12px}
.bigc .src{font-size:15px}
.bigc .logic{font-size:24px;margin:24px 0 0}
.bigc .cav{font-size:21px;line-height:1.45;margin:16px 0 0}
/* svg */
svg text{font-family:var(--sans);fill:var(--ink)}
.mono{font-family:var(--mono)!important;font-variant-numeric:tabular-nums}
.serif{font-family:var(--serif)!important}
.it{font-style:italic}
.f-ink{fill:var(--ink)} .f-mut{fill:var(--muted)} .f-acc{fill:var(--accent)} .f-risk{fill:var(--risk)} .f-calm{fill:var(--calm)} .f-surf{fill:var(--surface)}
.s-line{stroke:var(--line)} .s-mut{stroke:var(--muted)} .s-ink{stroke:var(--ink)} .s-acc{stroke:var(--accent)} .s-risk{stroke:var(--risk)} .s-calm{stroke:var(--calm)}
.nf{fill:none}
.dash{stroke-dasharray:6 7}
.fade{transition:opacity .6s,filter .6s}
.hide{opacity:0!important}
.tok{fill:var(--surface);stroke:var(--muted);stroke-width:2;transition:fill .6s,stroke .6s,opacity .6s,filter .6s}
.tok.race{fill:var(--risk);stroke:var(--risk)}
.tok.stop{fill:var(--calm);stroke:var(--calm)}
.tkl{fill:var(--muted);transition:fill .6s,opacity .6s,filter .6s}
.tkl.dark{fill:var(--ground)}
.wedge{fill:var(--risk);opacity:.07;transition:opacity .6s,filter .6s}
.btn{fill:var(--surface);stroke:var(--risk);stroke-width:3}
.ring{fill:none;stroke:var(--line);stroke-width:2;transition:stroke .6s,stroke-width .6s,opacity .6s,filter .6s}
.ring.calm{stroke:var(--calm);stroke-width:6}
.bub{fill:var(--surface);stroke:var(--line);stroke-width:2}
.tape{fill:none;stroke:var(--surface);stroke-width:30}
.gnd{fill:var(--surface)}
.ridge{fill:none;stroke:var(--muted);stroke-width:2.5}
.ball{fill:var(--ink)}
.ghost{opacity:.4}
.lamp{fill:var(--surface);stroke:var(--muted);stroke-width:2;transition:fill .5s,stroke .5s,opacity .5s,filter .5s}
.lamp.lit{fill:var(--calm);stroke:var(--calm)}
.glow{stroke-width:9!important}
/* controls and storyboard */
.ctl{margin-top:12px;font-family:var(--sans)}
.prog{position:relative;height:8px;background:var(--line);cursor:pointer}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent)}
.tickm{position:absolute;top:-3px;width:2px;height:14px;background:var(--ground)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
button{font:500 14px var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--line);padding:8px 14px;border-radius:3px;cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#voice{border-color:var(--accent);color:var(--accent)}
.bc{font:400 13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.time{font:400 14px var(--mono);color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.scenes{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:6px}
.scenes button{font-size:13px;padding:6px 10px}

.sb{margin-top:36px;max-width:820px}
.sb h2{font:600 26px var(--sans);margin:0 0 8px}
.lede{font:400 17px/1.55 var(--serif);color:var(--muted);margin:0 0 20px}
.lede code{font:400 14px var(--mono);color:var(--ink)}
.lede a{color:var(--accent);overflow-wrap:anywhere}
.pace{border-collapse:collapse;width:100%;margin:0 0 26px;font:400 14px var(--mono);font-variant-numeric:tabular-nums}
.pace th{font:500 13px var(--sans);color:var(--muted);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}

/* ---------- clock: every motion runs on the scene clock, so pause freezes it ---------- */
let sceneTime = 0, instant = false, tweens = [];
const ease = p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2, easeIn = p => p * p, lin = p => p;
function anim(d, fn, e) { if (instant || d <= 0) { fn(1); return; } tweens.push({ t0: sceneTime, d: d, fn: fn, e: e || ease }); fn(0); }
function later(d, fn) { if (instant || d <= 0) { fn(); return; } let done = false; tweens.push({ t0: sceneTime, d: d, e: lin, fn: p => { if (p >= 1 && !done) { done = true; fn(); } } }); }
function runTweens() {
  const cur = tweens; tweens = [];
  const keep = cur.filter(w => { const p = Math.max(0, Math.min(1, (sceneTime - w.t0) / w.d)); try { w.fn(w.e(p)); } catch (err) { console.error(err); return false; } return p < 1; });
  tweens = keep.concat(tweens);
}
function flushTweens() {
  const was = instant; instant = true;
  for (let n = 0; n < 6 && tweens.length; n++) { const cur = tweens; tweens = []; cur.forEach(w => { try { w.fn(1); } catch (err) { console.error(err); } }); }
  tweens = []; instant = was;
}
function tickN(el, a, b, d, f) { anim(d, p => { el.textContent = f(a + (b - a) * p); }); }

  setup() {

      .forEach(l => { const d = H('div', 'sl fade hide', colSet); d.style.fontSize = '17px'; d.append(l[0]); H('span', 'tag', d, 'check ' + l[1]); });
  },
  build() {
    const r = { balls: [] }, HY = 330, U = 80, TOP = 250, LX = q => 170 + 700 * q;

    r.P = Object.assign({}, P9); r.P9 = P9; r.P6 = P6; r.PO = PO;
    const LY = (q, P) => { const yr = HY + P.dr * U, ys = HY + P.ds * U;
      if (q < 0) return yr + (TOP - yr) * sm(-q / .14);
      if (q > 1) return ys + (TOP - ys) * sm((q - 1) / .14);
      if (q <= P.th) return yr + (HY - yr) * sm(q / P.th);
      return HY + (ys - HY) * sm((q - P.th) / (1 - P.th)); };

    r.pz = T(board, 72, 190, 'prize 9', 'mono f-ink', 24);
    r.os = F(board); circ(r.os, 968, 196, 16, 'tok race'); circ(r.os, 968, 196, 24, 'nf s-risk dash').setAttribute('stroke-width', 2);
    T(r.os, 934, 202, 'an outsider', 'f-mut', 16, 'end');
    r.d11 = F(board); itag(T(r.d11, 990, 700, 'believed above 29%', 'f-ink', 17, 'end'), 'd11');
    const ball = (q, cls, p) => { const b = { q: q, el: circ(p || board, 0, 0, 15, cls) }; r.balls.push(b); return b; };
    r.gh = F(board); r.g0 = ball(0, 'ball ghost', r.gh); r.g1 = ball(1, 'ball ghost', r.gh);
    r.b1 = ball(.55, 'ball fade hide'); r.b2 = ball(.55, 'ball fade hide');
    r.draw = () => {
      const P = r.P; let d = '';
      for (let k = 0; k <= 110; k++) { const q = -.14 + 1.28 * k / 110; d += (k ? 'L' : 'M') + LX(q).toFixed(1) + ' ' + LY(q, P).toFixed(1); }
      r.rid.setAttribute('d', d); r.gnd.setAttribute('d', d + 'L' + LX(1.14) + ' 745L' + LX(-.14) + ' 745Z');

    r.roll = (b, to, d) => { const from = b.q; anim(d, p => { b.q = from + (to - from) * p; r.draw(); }, easeIn); };
    r.draw();

/* ---------- beats: every step, title and card part becomes one beat, timed by the pacing model ---------- */
function words(s) { return String(s || '').split(/\s+/).filter(w => /[\p{L}\p{N}]/u.test(w)).length; }
function nums(s) { return (String(s || '').match(/[\u2212\-+]?\d[\d.,/]*%?/g) || []).length; }
function readT(s) { return s ? Math.max(MIN_CAPTION, words(s) / READ_WPM * 60 + nums(s) * NUMBER_BONUS) : 0; }
const BEAT = {};
let NBEATS = 0;
SCENES.forEach((sc, i) => {
  sc.id = 's' + i;
  const B = []; let t = 0;
  const push = (o, d) => { o.id = sc.id + '.b' + B.length; o.k = B.length; o.t = t; o.dur = d; o.stop = t + d; BEAT[o.id] = { s: i, k: o.k }; B.push(o); t += d; };
  push({ kind: 'title', text: sc.ownTitle || (sc.kicker ? sc.kicker + ': ' : '') + sc.title }, SCENE_TITLE);
  sc.steps.forEach(st => {
    if (st.panel) { st.f = r => r.panel; st.txt = panelText(sc.panel); }
    const look = Math.max(LOOK, (st.a || 0) + .5), read = readT(st.cap) + readT(st.txt) + (st.hold || 0);
    const o = { kind: 'step', st: st, cap: st.cap || '', look: look, capOff: look + read };
    push(o, look + read + GAP);
    if (o.cap) o.stop = o.t + o.capOff - .001;
  });
  castFor(sc.cast).forEach((e, ci) => cardParts(e).forEach(p => push({ kind: 'card', ci: ci, part: p.key, text: p.text }, LOOK + readT(p.read))));
  sc.beats = B; sc.dur = +(t + END_HOLD).toFixed(2); NBEATS += B.length;
});
const TOTAL = SCENES.reduce((a, s) => a + s.dur, 0);
const START = []; SCENES.reduce((a, s, i) => { START[i] = a; return a + s.dur; }, 0);
const mmss = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
/* ---------- in a recursive.eco playlist: ?embed=1, ?scene=N[&to=M], ?clock=1 (see the note at the top) ---------- */
const QS = new URLSearchParams(location.search);
const EMBED = QS.get('embed') === '1' || window.self !== window.top;
const sceneQ = v => Math.max(0, Math.min(SCENES.length - 1, parseInt(v, 10) || 0));
const FIRST = QS.has('scene') ? sceneQ(QS.get('scene')) : 0;
const LAST = QS.has('to') ? Math.max(FIRST, sceneQ(QS.get('to'))) : (QS.has('scene') ? FIRST : SCENES.length - 1);
function scriptOf(b) {
  if (b.kind !== 'step') return b.text;
  const st = b.st;
  if (st.cap) return st.cap + (st.txt ? '   [on screen: ' + st.txt + ']' : '');
  if (st.txt) return '[on screen] ' + st.txt;
  return '[look] ' + (st.d || '');
}

/* ---------- focus: one element or small group; everything else dims ---------- */
const ROOTS = [board, colSet, colCast];
let fxList = [], dimList = [];
function dim(e) { e.classList.add('dim'); dimList.push(e); }
function setFocus(f) {
  dimList.forEach(e => e.classList.remove('dim')); dimList = [];
  fxList.forEach(e => e.classList.remove('fxo'));
  fxList = (Array.isArray(f) ? f : [f]).filter(e => e && ROOTS.some(rt => rt !== e && rt.contains(e)));
  if (!fxList.length) { fxr.classList.add('hide'); return; }
  const keep = new Set(), foc = new Set(fxList);
  fxList.forEach(e => { for (let n = e; n && ROOTS.indexOf(n) < 0; n = n.parentNode) keep.add(n); });
  ROOTS.forEach(rt => { if (!fxList.some(e => rt.contains(e))) dim(rt); });
  const parents = new Set(); keep.forEach(n => { if (!foc.has(n.parentNode)) parents.add(n.parentNode); });
  parents.forEach(p => { for (const c of p.children) if (!keep.has(c)) dim(c); });
  fxList.forEach(e => { if (!(e instanceof SVGElement)) e.classList.add('fxo'); });
  outline(true);
}
function outline(fresh) {
  const L = fxList.filter(e => e instanceof SVGGraphicsElement && board.contains(e));
  const M = board.getScreenCTM();
  if (!L.length || !M) { fxr.classList.add('hide'); return; }
  const I = M.inverse();
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  L.forEach(e => {
    let bb; try { bb = e.getBBox(); } catch (err) { return; }
    if (!bb.width && !bb.height) return;
    const m = I.multiply(e.getScreenCTM());
    [[bb.x, bb.y], [bb.x + bb.width, bb.y], [bb.x, bb.y + bb.height], [bb.x + bb.width, bb.y + bb.height]].forEach(p => {
      const x = m.a * p[0] + m.c * p[1] + m.e, y = m.b * p[0] + m.d * p[1] + m.f;
      x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y);
    });
  });
  if (!isFinite(x0)) { fxr.classList.add('hide'); return; }
  const P = 14; x0 = Math.max(6, x0 - P); y0 = Math.max(6, y0 - P); x1 = Math.min(1594, x1 + P); y1 = Math.min(894, y1 + P);
  fxr.setAttribute('x', x0.toFixed(1)); fxr.setAttribute('y', y0.toFixed(1)); fxr.setAttribute('width', (x1 - x0).toFixed(1)); fxr.setAttribute('height', (y1 - y0).toFixed(1));
  if (fresh && !RM) { fxr.classList.add('hide'); requestAnimationFrame(() => { if (fxList.length) fxr.classList.remove('hide'); }); }
  else fxr.classList.remove('hide');
}

/* ---------- player ---------- */
let cur = 0, bi = -1, tb = 0, R = {}, playing = false, stepMode = false, stillView = false, ended = false, voice = null, capOn = null, lastT = 0;
function build(i) {
  cur = Math.max(0, Math.min(SCENES.length - 1, i));
  const sc = SCENES[cur];
  tweens = []; sceneTime = 0; bi = -1; tb = 0; stillView = false; ended = false;
  setFocus(null);
  board.textContent = ''; colSet.textContent = '';
  $('col').classList.toggle('gone', !!sc.full);
  $('kk').textContent = $('tck').textContent = sc.kicker || '';
  $('tt').textContent = $('tct').textContent = sc.title || '';
  R = {};
  try { if (sc.panel) panel(sc.panel); if (sc.setup) sc.setup(); R = sc.build() || {}; } catch (err) { console.error(err); }
  R.panel = colSet.querySelector('.pg'); R.cards = Array.from(colSet.querySelectorAll('.card')); R.lines = Array.from(colSet.querySelectorAll('.sl'));
  buildCast(sc);
  setCap(null);
}
function startBeat(k, quiet) {
  const sc = SCENES[cur], b = sc.beats[k];
  bi = k; if (k > tb) tb = k;
  instant = !!quiet || RM;
  let f = null;
  try {
    if (b.kind === 'step') { if (b.st.run) b.st.run(R); if (b.st.f) f = b.st.f(R); }
    else if (b.kind === 'card') f = cardBeat(b);
  } catch (err) { console.error(b.id, err); }
  instant = RM;
  if (quiet) return;
  const titling = b.kind === 'title' && !sc.ownTitle;
  stage.classList.toggle('titling', titling);
  $('tc').classList.toggle('hide', !titling);
  $('hd').classList.toggle('hide', b.kind === 'title' || !!sc.full || !sc.kicker);
  setFocus(f); setCap(null);
}
function setCap(b) {
  capOn = b || null;
  const st = b && b.st;
  capEl.textContent = b ? b.cap : '';
  capEl.className = 'cap' + (st && st.big ? ' big' : '') + (st && st.hope ? ' hope' : '');
  if (b && !RM) { void capEl.offsetWidth; capEl.classList.add('in'); }
}
function capTick() {
  const b = SCENES[cur].beats[bi];
  const want = b && b.cap && sceneTime >= b.t + b.look && sceneTime < b.t + b.capOff ? b : null;
  if (want !== capOn) setCap(want);
}
function seek(i, k) {
  build(i);
  const B = SCENES[cur].beats; k = Math.max(0, Math.min(B.length - 1, k || 0));
  for (let j = 0; j < k; j++) startBeat(j, true);
  tb = k; sceneTime = B[k].t; startBeat(k, false);
}
function stillAt(i) {
  build(i);
  const sc = SCENES[cur];
  sc.beats.forEach((b, j) => { if (b.kind === 'step') startBeat(j, true); });
  bi = tb = sc.beats.length - 1; sceneTime = sc.dur; stillView = true;
  stage.classList.remove('titling'); $('tc').classList.add('hide'); $('hd').classList.toggle('hide', !!sc.full || !sc.kicker);
  colCast.classList.add('hide'); setFocus(null); setCap(null);
}
function frame(now) {
  requestAnimationFrame(frame);
  const dt = lastT ? Math.min(.1, (now - lastT) / 1000) : 0; lastT = now;
  if (!playing) return;
  if (voice) cueTick();
  const sc = SCENES[cur], held = stepMode || !!voice;
  const lim = held ? sc.beats[tb].stop : Infinity;

  while (bi + 1 < sc.beats.length && sc.beats[bi + 1].t <= sceneTime && (!held || bi + 1 <= tb)) startBeat(bi + 1, false);
  capTick(); runTweens();
  if (tweens.length) outline(false);

    else { playing = false; ended = true; }

}
function nextBeat() {
  const sc = SCENES[cur];

function prevBeat() {
  if (tb > 0) seek(cur, tb - 1);

  if (playing || stepMode) seek(i, 0); else stillAt(i);

}

/* ---------- a narration track: narration.js may define window.NARRATION = { src, cues: [{ beat, t }] } ---------- */
function startVoice() {
  if (!voice) {
    const cues = NAR.cues.filter(c => c && BEAT[c.beat] && isFinite(+c.t)).map(c => ({ beat: c.beat, t: +c.t })).sort((a, b) => a.t - b.t);
    voice = { a: new Audio(NAR.src), cues: cues, i: 0 };
    voice.a.addEventListener('ended', () => { playing = false; ui(); });
  }
  stepMode = false; voice.i = 0;
  try { voice.a.currentTime = 0; } catch (err) { /* not loaded yet */ }
  seek(0, 0);
  const p = voice.a.play(); playing = true;
  if (p && p.catch) p.catch(err => { console.error('narration could not play', err); playing = false; ui(); });
  ui();

function cueTick() {
  const v = voice;

}

/* ---------- controls ---------- */
const chips = [];
SCENES.forEach((sc, i) => { const li = H('li', '', $('scenes')); const b = H('button', '', li, 'S' + i + ' ' + sc.name); b.type = 'button'; b.addEventListener('click', () => go(i)); chips.push(b); });
SCENES.forEach((sc, i) => { if (i) { const m = H('span', 'tickm', $('prog')); m.style.left = (100 * START[i] / TOTAL) + '%'; } });
function ui() {
  const sc = SCENES[cur], k = Math.max(0, bi), b = sc.beats[k];
  $('play').textContent = stepMode && !voice ? 'Next beat' : playing ? 'Pause' : 'Play';
  chips.forEach((c, i) => c.setAttribute('aria-current', i === cur ? 'true' : 'false'));
  const el = START[cur] + Math.min(sceneTime, sc.dur);

  $('time').textContent = 'S' + cur + '  ' + mmss(el) + ' / ' + mmss(TOTAL);
  $('bc').textContent = 'beat ' + (k + 1) + ' of ' + sc.beats.length + ' \u00B7 ' + (b ? b.id : '') + (stepMode && !voice ? ' \u00B7 step' : '') + (voice ? ' \u00B7 voice' : '');

$('play').addEventListener('click', () => { if (stepMode && !voice) nextBeat(); else toggle(); });
$('prev').addEventListener('click', () => go(cur - 1));
$('next').addEventListener('click', () => go(cur + 1));
$('prog').addEventListener('click', e => { const f = (e.clientX - $('prog').getBoundingClientRect().left) / $('prog').clientWidth * TOTAL; let i = 0; while (i < SCENES.length - 1 && START[i + 1] <= f) i++; go(i); });
if (NAR) { $('voice').classList.remove('gone'); $('voice').addEventListener('click', startVoice); }
wrap.addEventListener('click', () => { if (stepMode && !voice) nextBeat(); });
document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const inCtl = e.target.closest && e.target.closest('button,a,input,select,textarea');
  const space = (e.key === ' ' || e.code === 'Space') && !inCtl;
  if (stepMode && !voice) {
    if (space || e.key === 'ArrowRight') { e.preventDefault(); nextBeat(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); prevBeat(); }
    return;
  }
  if (space) { e.preventDefault(); toggle(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); go(cur + 1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); go(cur - 1); }

/* ---------- start: #record hides the controls, #s3 jumps, #step moves one beat at a time ---------- */
function applyHash(first) {
  const toks = (location.hash || '').slice(1).toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
  document.documentElement.classList.toggle('rec', toks.indexOf('record') >= 0 || EMBED);
  const was = stepMode; stepMode = toks.indexOf('step') >= 0;
  let s = null, k = 0; toks.forEach(t => { const m = /^s(\d+)$/.exec(t), n = /^b(\d+)$/.exec(t); if (m) s = Math.min(SCENES.length - 1, +m[1]); if (n) k = +n[1]; });
  if (first || s !== null || was !== stepMode) { if (voice) { voice.a.pause(); voice = null; } seek(s === null ? (first ? FIRST : cur) : s, k); playing = true; ui(); }
  if (!first && s !== null) wrap.scrollIntoView({ block: 'start', behavior: RM ? 'auto' : 'smooth' });
  fit();
}
/* ---------- the player's clock (?clock=1): seconds into the scene range, play or pause ---------- */
function rangeT() { let a = 0; for (let i = FIRST; i < cur; i++) a += SCENES[i].dur; return a + sceneTime; }
function jumpTo(t) {
  let i = FIRST, a = Math.max(0, t);
  while (i < LAST && a >= SCENES[i].dur) { a -= SCENES[i].dur; i++; }
  a = Math.min(a, SCENES[i].dur);
  const B = SCENES[i].beats; let k = 0;
  while (k + 1 < B.length && B[k + 1].t <= a) k++;
  ended = false; stepMode = false; seek(i, k); sceneTime = a; capTick();
}
window.addEventListener('message', e => {
  if (e.source !== window.parent || window.parent === window) return;
  const d = e.data;
  if (!d || typeof d !== 'object' || d.type !== 'clock' || typeof d.t !== 'number' || !isFinite(d.t)) return;
  if (Math.abs(rangeT() - d.t) > 0.6) jumpTo(d.t);
  if (!!d.playing !== playing) { playing = !!d.playing; ui(); }
});
window.addEventListener('hashchange', () => applyHash(false));
applyHash(true);
requestAnimationFrame(frame);
