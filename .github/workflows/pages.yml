name: Pages

# Publishes the static index in `site/`, the game in `game/`, and the grammar JSON in
# `grammars/` to GitHub Pages. No install, no node_modules, no build tooling — the deploy
# directory is assembled with `cp`.
#
# `.nojekyll` is copied in deliberately: without it, Pages runs Jekyll and every path whose
# name starts with `_` is silently 404'd — which here would be `grammars/_eco_ids.json`, the
# file the site and the channel importer both point at.
#
# THIS WORKFLOW IS NOT WHAT PUBLISHES THE SITE TODAY, and it fails on every push.
#
#   gh api repos/PlayfulProcess/recursive-learning/pages
#   -> "build_type":"legacy", "source":{"branch":"main","path":"/"}, "cname":"game.recursive.eco"
#
# Pages is set to the LEGACY branch build: game.recursive.eco is served by Jekyll straight from
# the root of `main`, and `actions/deploy-pages` refuses to run while the source is a branch
# rather than GitHub Actions. So the published root is the repo root — `index.html`, `game/`,
# `grammars/`, and the root `.nojekyll` that keeps Jekyll from 404ing `grammars/_eco_ids.json`.
# `scripts/build-site.mjs` writes the landing to BOTH the repo root and `site/` for that reason.
#
# It is kept, not deleted, because it is the whole config for the other source: flipping
# Settings → Pages → Source to "GitHub Actions" makes this the publisher and `site/` the root,
# with no other change. Until then its red X is expected.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'game/**'
      - 'grammars/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r game _site/game
          cp -r grammars _site/grammars
          test -f _site/.nojekyll || touch _site/.nojekyll
          echo "--- deploying ---"
          find _site -maxdepth 2 | sort

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
