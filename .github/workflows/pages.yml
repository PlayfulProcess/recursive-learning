name: Pages

# Publishes the static index in `site/` (with 404.html), the game in `game/`, the glossary in
# `glossary/`, the shared navigation in `shared/` and the grammar JSON in `grammars/` to GitHub
# Pages. No install, no node_modules, no build tooling — the deploy directory is assembled with `cp`,
# then checked by `node scripts/check-links.mjs` (node is already on the runner; no dependencies).
#
# A NEW TOP-LEVEL FOLDER (explainers/, lab/, map/) must be added to the `cp` lines AND to
# on.push.paths below. If it is not, the link check fails this job before anything is deployed,
# naming the folder: that is the guard against a repeat of /glossary/, merged but 404ing because
# this file did not copy it.
#
# `.nojekyll` is copied in deliberately: without it, Pages runs Jekyll and every path whose
# name starts with `_` is silently 404'd — which here would be `grammars/_eco_ids.json`, the
# file the site and the channel importer both point at.
#
# THIS WORKFLOW IS WHAT PUBLISHES THE SITE (since Sep 24 2026). Checked on Sep 24:
#
#   gh api repos/PlayfulProcess/recursive-learning/pages
#   -> "build_type":"workflow", "cname":"learning.recursive.eco", https certificate approved
#
# and the last three runs of this workflow succeeded. So the published root is `site/`, with
# `game/`, `glossary/`, `shared/` and `grammars/` copied beside it. The custom domain lives in Settings -> Pages; an
# Actions deploy does not read the root `CNAME` file, which is kept (holding the same name) for
# the branch build, if the source is ever switched back. Before Sep 24 the source was the legacy
# branch build at game.recursive.eco, which now answers 404 ("Site not found").

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'game/**'
      - 'grammars/**'
      - 'glossary/**'
      - 'shared/**'
      - 'scripts/check-links.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r game _site/game
          cp -r grammars _site/grammars
          cp -r glossary _site/glossary
          cp -r shared _site/shared
          test -f _site/.nojekyll || touch _site/.nojekyll
          echo "--- deploying ---"
          find _site -maxdepth 2 | sort

      # Every internal link on every page must land on a file in _site (and every folder of the
      # repo that holds pages must have been copied). Fails the deploy, not the visitor.
      - name: Check every internal link
        run: node scripts/check-links.mjs _site --repo .

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
