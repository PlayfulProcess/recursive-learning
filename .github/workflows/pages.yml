name: Pages

# Publishes the site to GitHub Pages: `site/` at the root (the tarot-template shell: home, viewers,
# pages, map, 404) with `game/`, `glossary/`, `grammars/` and `shared/` beside it. No install, no
# node_modules, no build tooling. The folder list lives ONCE, in scripts/site-folders.txt, which
# scripts/assemble-site.sh reads (here and locally). Then two checks, both dependency-free:
#   node scripts/check-links.mjs      every internal link lands on a file (and every page folder was copied)
#   python3 scripts/check_all.py      grammars valid, generated files current, collection, sync
#                                     contract, words, reachability, theme and hygiene, privacy, As-If
# Generated grammars are built LOCALLY and committed (python scripts/build_all.py); CI only checks
# that each committed output equals a fresh rebuild. There is no bot commit.
#
# A NEW TOP-LEVEL PAGE FOLDER (explainers/, lab/, data/) is one line in scripts/site-folders.txt
# plus its menu entry in site/site-header.js. If the line is missing, the link check fails this job
# before anything is deployed, naming the folder: the guard against a repeat of /glossary/,
# merged but 404ing because this file did not copy it.
#
# PULL REQUESTS run the build job (assemble + both checks) but never deploy, so a PR shows its
# checks before anyone merges it.
#
# `.nojekyll` is copied in deliberately: without it, Pages runs Jekyll and every path whose
# name starts with `_` is silently 404'd — which here would be `grammars/_eco_ids.json`, the
# file the site and the channel importer both point at.
#
# THIS WORKFLOW IS WHAT PUBLISHES THE SITE (since Sep 24 2026). Checked on Sep 24:
#
#   gh api repos/PlayfulProcess/recursive-learning/pages
#   -> "build_type":"workflow", "cname":"learning.recursive.eco", https certificate approved
#
# and the last three runs of this workflow succeeded. So the published root is `site/`, with
# `game/`, `glossary/`, `shared/` and `grammars/` copied beside it. The custom domain lives in Settings -> Pages; an
# Actions deploy does not read the root `CNAME` file, which is kept (holding the same name) for
# the branch build, if the source is ever switched back. Before Sep 24 the source was the legacy
# branch build at game.recursive.eco, which now answers 404 ("Site not found").

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'game/**'
      - 'grammars/**'
      - 'glossary/**'
      - 'shared/**'
      - 'scripts/**'
      - 'research/**'
      - 'recursive-eco.json'
      - 'explainers/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main, lab/navigation]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deploys queue one at a time; a pull request's check runs in its own group, so it never holds
# up (or is held up by) a deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site (scripts/site-folders.txt)
        run: bash scripts/assemble-site.sh _site

      # Every internal link on every page must land on a file in _site (and every folder of the
      # repo that holds pages must have been copied). Fails the deploy, not the visitor.
      - name: Check every internal link
        run: node scripts/check-links.mjs _site --repo .

      # Everything else scripts/check_all.py knows, on the same assembled site. Python standard
      # library only. --check rebuilds each generated file into a temp folder and diffs it.
      - name: Check the whole site (check_all)
        run: python3 scripts/check_all.py --site _site --check

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
